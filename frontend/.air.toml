# Hot reload cho frontend (thay `trunk serve`): chạy `air` trong thư mục frontend.
# Mỗi lần sửa .templ / .go / input.css / app.js: sinh code templ → build CSS → build binary.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && tailwindcss -c tailwind.config.js -i static/css/input.css -o static/css/app.css --minify && go build -o ./tmp/web ./cmd/web"
  bin = "./tmp/web"
  include_ext = ["go", "templ", "css", "js"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_templ\\.go$", "static/css/app\\.css$", "static/js/htmx\\.min\\.js$"]
  delay = 300

[misc]
  clean_on_exit = true
